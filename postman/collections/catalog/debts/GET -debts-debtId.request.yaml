$kind: http-request
name: GET /debts/:debtId
description: |
  Source: src/modules/debts/debts.controller.ts
url: "{{base_url}}/debts/{{debt_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
