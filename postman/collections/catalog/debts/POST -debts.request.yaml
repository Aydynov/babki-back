$kind: http-request
name: POST /debts
description: |-
  Source: src/modules/debts/debts.controller.ts
  Optional body fields: description, dueDate, status
url: "{{base_url}}/debts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currency": "{{currency}}",
      "debtor": "Postman test",
      "principalAmount": 100,
      "remainingAmount": 100
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {const b=pm.response.json(); if (b._id || b.id) pm.variables.set('debt_id', b._id || b.id);}
    language: text/javascript
order: 3000
