$kind: http-request
name: POST /debts/:debtId/repayments
description: |-
  Source: src/modules/debts/debts.controller.ts
  Optional body fields: accountId, description, isIncome
url: "{{base_url}}/debts/{{debt_id}}/repayments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "repaymentDate": "{{now}}",
      "amount": 100
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 7000
