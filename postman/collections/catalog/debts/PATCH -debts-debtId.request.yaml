$kind: http-request
name: PATCH /debts/:debtId
description: |-
  Source: src/modules/debts/debts.controller.ts
  Optional body fields: debtor, principalAmount, remainingAmount, description, dueDate, status
url: "{{base_url}}/debts/{{debt_id}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "debtor": "Postman test",
      "principalAmount": 100,
      "remainingAmount": 100,
      "description": "Postman test",
      "dueDate": "{{future_date}}",
      "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 6000
