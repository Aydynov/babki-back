$kind: http-request
name: POST /expense-limits
description: |-
  Source: src/modules/expense-limits/expense-limits.controller.ts
  Optional body fields: startDate, endDate
url: "{{base_url}}/expense-limits"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currency": "{{currency}}",
      "categoryId": "{{category_id}}",
      "total": 100
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {const b=pm.response.json(); if (b._id || b.id) pm.variables.set('limit_id', b._id || b.id);}
    language: text/javascript
order: 1000
