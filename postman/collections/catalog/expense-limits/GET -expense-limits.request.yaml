$kind: http-request
name: GET /expense-limits
description: |
  Source: src/modules/expense-limits/expense-limits.controller.ts
url: "{{base_url}}/expense-limits?periodDate={{now}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: categoryId
    value: "{{category_id}}"
    disabled: true
    description: Optional; enable when needed
  - key: currency
    value: "{{currency}}"
    disabled: true
    description: Optional; enable when needed
  - key: periodDate
    value: "{{now}}"
    description: Required
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
