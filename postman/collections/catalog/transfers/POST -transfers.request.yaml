$kind: http-request
name: POST /transfers
description: |-
  Source: src/modules/transactions/transfers/transfers.controller.ts
  Optional body fields: description
url: "{{base_url}}/transfers"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sourceAccountId": "{{source_account_id}}",
      "destinationAccountId": "{{destination_account_id}}",
      "sourceAmount": 100,
      "destinationAmount": 100,
      "transactionDate": "{{now}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {const b=pm.response.json(); if (b._id || b.id) pm.variables.set('transfer_id', b._id || b.id);}
    language: text/javascript
order: 1000
