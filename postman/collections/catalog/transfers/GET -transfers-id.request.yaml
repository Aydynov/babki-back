$kind: http-request
name: GET /transfers/:id
description: |
  Source: src/modules/transactions/transfers/transfers.controller.ts
url: "{{base_url}}/transfers/{{transfer_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
