$kind: http-request
name: PATCH /plans/:planId
description: |-
  Source: src/modules/plans/plans.controller.ts
  Optional body fields: description, targetDate, amount, categoryId
url: "{{base_url}}/plans/{{plan_id}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Postman test",
      "targetDate": "{{future_date}}",
      "amount": 100,
      "categoryId": "{{category_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
