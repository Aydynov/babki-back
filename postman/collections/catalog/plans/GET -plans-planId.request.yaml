$kind: http-request
name: GET /plans/:planId
description: |
  Source: src/modules/plans/plans.controller.ts
url: "{{base_url}}/plans/{{plan_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
