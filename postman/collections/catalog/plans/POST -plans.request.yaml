$kind: http-request
name: POST /plans
description: |-
  Source: src/modules/plans/plans.controller.ts
  Optional body fields:
url: "{{base_url}}/plans"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currency": "{{currency}}",
      "description": "Postman test",
      "targetDate": "{{future_date}}",
      "amount": 100,
      "categoryId": "{{category_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {const b=pm.response.json(); if (b._id || b.id) pm.variables.set('plan_id', b._id || b.id);}
    language: text/javascript
order: 1000
