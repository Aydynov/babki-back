$kind: http-request
name: 'POST /spaces/:spaceId/transfers'
description: |-
  Source: src/modules/space-finances/space-finances.controller.ts
  Optional body fields: description
url: '{{base_url}}/spaces/{{space_id}}/transfers'
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sourceAccountId": "{{space_source_account_id}}",
      "destinationAccountId": "{{space_destination_account_id}}",
      "sourceAmount": 100,
      "destinationAmount": 100,
      "transactionDate": "{{now}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 17000
