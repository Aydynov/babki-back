$kind: http-request
name: 'GET /spaces/:spaceId/debts/:id/repayments/:repaymentId'
description: |
  Source: src/modules/space-finances/group-debts.controller.ts
url: '{{base_url}}/spaces/{{space_id}}/debts/{{space_debt_id}}/repayments/{{space_repayment_id}}'
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 8000
