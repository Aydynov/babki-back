$kind: http-request
name: GET /incomes/:incomeId
description: |
  Source: src/modules/transactions/incomes/incomes.controller.ts
url: "{{base_url}}/incomes/{{income_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
