$kind: http-request
name: PATCH /incomes/:incomeId
description: |-
  Source: src/modules/transactions/incomes/incomes.controller.ts
  Optional body fields: amount, description, source
url: "{{base_url}}/incomes/{{income_id}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 100,
      "description": "Postman test",
      "source": "Postman test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
