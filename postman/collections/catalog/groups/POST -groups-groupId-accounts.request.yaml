$kind: http-request
name: POST /groups/:groupId/accounts
description: |-
  Source: src/modules/group-finances/group-finances.controller.ts
  Optional body fields: type, amount, openedAt
url: "{{base_url}}/groups/{{group_id}}/accounts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman {{run_id}}",
      "currency": "{{currency}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 12000
