$kind: http-request
name: GET /groups/:groupId/accounts
description: |
  Source: src/modules/group-finances/group-finances.controller.ts
url: "{{base_url}}/groups/{{group_id}}/accounts"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: type
    value: balance
    disabled: true
    description: Optional; enable when needed
  - key: currency
    value: "{{currency}}"
    disabled: true
    description: Optional; enable when needed
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 11000
