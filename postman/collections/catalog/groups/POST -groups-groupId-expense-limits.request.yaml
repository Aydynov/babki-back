$kind: http-request
name: POST /groups/:groupId/expense-limits
description: |-
  Source: src/modules/group-finances/group-finances.controller.ts
  Optional body fields: startDate, endDate
url: "{{base_url}}/groups/{{group_id}}/expense-limits"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryId": "{{group_category_id}}",
      "currency": "{{currency}}",
      "total": 100
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 40000
