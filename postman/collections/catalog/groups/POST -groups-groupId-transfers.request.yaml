$kind: http-request
name: POST /groups/:groupId/transfers
description: |-
  Source: src/modules/group-finances/group-finances.controller.ts
  Optional body fields: description
url: "{{base_url}}/groups/{{group_id}}/transfers"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sourceAccountId": "{{group_source_account_id}}",
      "destinationAccountId": "{{group_destination_account_id}}",
      "sourceAmount": 100,
      "destinationAmount": 100,
      "transactionDate": "{{now}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 17000
