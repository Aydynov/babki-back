$kind: http-request
name: POST /groups/:groupId/incomes
description: |-
  Source: src/modules/group-finances/group-finances.controller.ts
  Optional body fields: description
url: "{{base_url}}/groups/{{group_id}}/incomes"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accountId": "{{group_account_id}}",
      "amount": 100,
      "transactionDate": "{{now}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 30000
