$kind: http-request
name: POST /auth/login
description: |-
  Source: src/modules/auth/auth.controller.ts
  Optional body fields:
url: '{{base_url}}/auth/login'
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {
        const body = pm.response.json();
        if (body.accessToken) pm.variables.set('access_token', body.accessToken);
        else { pm.variables.unset('access_token'); if (body.challengeToken) pm.variables.set('challenge_token', body.challengeToken); }
      }
    language: text/javascript
order: 2000
