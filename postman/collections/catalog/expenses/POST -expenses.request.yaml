$kind: http-request
name: POST /expenses
description: |-
  Source: src/modules/transactions/expenses/expenses.controller.ts
  Optional body fields: description, merchant, items
url: "{{base_url}}/expenses"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accountId": "{{account_id}}",
      "categoryId": "{{category_id}}",
      "amount": 100,
      "transactionDate": "{{now}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {const b=pm.response.json(); if (b._id || b.id) pm.variables.set('expense_id', b._id || b.id);}
    language: text/javascript
order: 1000
