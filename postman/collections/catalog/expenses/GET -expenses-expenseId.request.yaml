$kind: http-request
name: GET /expenses/:expenseId
description: |
  Source: src/modules/transactions/expenses/expenses.controller.ts
url: "{{base_url}}/expenses/{{expense_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 4000
