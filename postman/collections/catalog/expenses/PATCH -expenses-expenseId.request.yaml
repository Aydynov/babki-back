$kind: http-request
name: PATCH /expenses/:expenseId
description: |-
  Source: src/modules/transactions/expenses/expenses.controller.ts
  Optional body fields: categoryId, amount, description, merchant, items
url: "{{base_url}}/expenses/{{expense_id}}"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryId": "{{category_id}}",
      "amount": 100,
      "description": "Postman test",
      "merchant": "Postman test",
      "items": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 5000
