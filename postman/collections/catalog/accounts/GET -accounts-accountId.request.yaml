$kind: http-request
name: GET /accounts/:accountId
description: |
  Source: src/modules/accounts/accounts/accounts.controller.ts
url: "{{base_url}}/accounts/{{account_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 3000
