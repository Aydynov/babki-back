$kind: http-request
name: GET /accounts
description: |
  Source: src/modules/accounts/accounts/accounts.controller.ts
url: "{{base_url}}/accounts"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: type
    value: balance
    disabled: true
    description: Optional; enable when needed
  - key: currency
    value: "{{currency}}"
    disabled: true
    description: Optional; enable when needed
  - key: toDate
    value: "{{future_date}}"
    disabled: true
    description: Optional; enable when needed
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 1000
