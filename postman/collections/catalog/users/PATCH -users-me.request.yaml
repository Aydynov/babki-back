$kind: http-request
name: PATCH /users/me
description: |-
  Source: src/modules/users/users.controller.ts
  Optional body fields: firstName, lastName, email, description, defaultCurrency, defaultAccountId
url: "{{base_url}}/users/me"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Postman",
      "lastName": "Tester",
      "email": "{{email}}",
      "description": "Postman test",
      "defaultCurrency": "{{currency}}",
      "defaultAccountId": "{{default_account_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
