$kind: http-request
name: POST /accounts
description: |-
  Source: src/modules/accounts/accounts/accounts.controller.ts
  Optional body fields: amount, openedAt
url: "{{base_url}}/accounts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman {{run_id}}",
      "type": "balance",
      "currency": "RUB",
      "amount": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {const b=pm.response.json(); if (b._id || b.id) pm.variables.set('account_id', b._id || b.id);}
    language: text/javascript
order: 4000
