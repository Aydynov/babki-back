$kind: http-request
name: 'POST /spaces/:spaceId/expense-categories'
description: |-
  Source: src/modules/expense-categories/expense-categories.controller.ts
  Optional body fields: description, color, isArchived
url: '{{base_url}}/spaces/{{space_id}}/expense-categories'
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman {{run_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('JSON response', () => pm.response.to.be.json);
      if (pm.response.code === 201) {const b=pm.response.json(); if (b._id || b.id) pm.variables.set('category_id', b._id || b.id);}
    language: text/javascript
order: 5000
