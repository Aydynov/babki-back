$kind: http-request
name: 'GET /spaces/:spaceId/accounts/:accountId'
description: |
  Source: src/modules/accounts/accounts/accounts.controller.ts
url: '{{base_url}}/spaces/{{space_id}}/accounts/{{account_id}}'
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
      pm.test('Income and expense net balance', () => pm.expect(pm.response.json().amount).to.equal(1000));
    language: text/javascript
order: 8000
