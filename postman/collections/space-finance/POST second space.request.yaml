$kind: http-request
name: Create second space
url: '{{base_url}}/spaces'
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
order: 2600
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      if(pm.response.code===201) pm.variables.set('other_space_id', pm.response.json().id || pm.response.json()._id);
body:
  type: json
  content: |-
    {
      "name": "Other {{run_id}}"
    }
