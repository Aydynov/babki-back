apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: babki
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: babki
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongo-replication
  namespace: babki
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mongo }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mongo }
      ports:
        - { protocol: TCP, port: 27017 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mongo }
      ports:
        - { protocol: TCP, port: 27017 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongo-clients
  namespace: babki
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mongo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: babki-api }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mongo-bootstrap }
      ports:
        - { protocol: TCP, port: 27017 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-mongo
  namespace: babki
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: babki-api }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mongo }
      ports:
        - { protocol: TCP, port: 27017 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bootstrap-to-mongo
  namespace: babki
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mongo-bootstrap }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mongo }
      ports:
        - { protocol: TCP, port: 27017 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-api
  namespace: babki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: babki-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: babki-gateway
      ports:
        - protocol: TCP
          port: 5001
